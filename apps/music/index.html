<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://accounts.google.com 'sha256-3aymsP1J/WwiUjfkHajI3prDhnqsHmueupWQiC4bbPQ='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://coverartarchive.org; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' https://accounts.google.com https://www.googleapis.com https://oauth2.googleapis.com https://lrclib.net https://coverartarchive.org; frame-src 'self' blob: https://accounts.google.com; object-src 'none'; base-uri 'self'; worker-src 'self' blob:; form-action 'self'"
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0a12" />
    <meta
      name="description"
      content="Aura Music — a premium, offline-first music player for your local library."
    />
    <link rel="apple-touch-icon" href="./icons/icon-maskable-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Aura Music</title>
    <script>
      // Contraparte del 404.html del deploy: si venimos de una ruta profunda
      // redirigida como ?/album/42, la restaura con replaceState antes de que
      // el router lea location — si no, vería "/" y no "/album/42".
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
