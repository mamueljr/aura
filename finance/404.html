    <script>
      // Contraparte del 404.html del deploy: si venimos de una ruta profunda
      // redirigida como ?/movimientos, la restaura con replaceState antes de
      // que el router lea location — si no, vería "/" y no "/movimientos".
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
